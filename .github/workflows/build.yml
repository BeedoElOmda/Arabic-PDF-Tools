name: Build Windows packages

# Builds all Windows packages from this repository with packaging/build.sh.
# Runs when a release is published (files are attached to it), or by hand from the Actions tab.
# Code signing: once SignPath Foundation approves the project, set the repository
# variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG and the
# secret SIGNPATH_API_TOKEN. Until then the signing steps are skipped and files ship unsigned.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the files to (e.g. v1.3.0). Leave empty to only build."
        required: false

permissions:
  contents: write   # needed to attach files to a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update -q && sudo apt-get install -y -q nsis zip

      - name: Check version matches the release tag
        if: github.event_name == 'release'
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          tag="${{ github.event.release.tag_name }}"
          [ "v$v" = "$tag" ] || { echo "VERSION file ($v) does not match tag $tag"; exit 1; }

      - name: Build
        run: bash packaging/build.sh

      # ---- unsigned build output (also the input for signing) ----
      - id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: arabic-pdf-tools-windows
          path: |
            dist/ArabicPDFTools-Setup-*.exe
            dist/ArabicPDFTools.exe
          if-no-files-found: error

      # ---- SignPath Foundation code signing (needs manual approval in SignPath) ----
      - name: Sign with SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: SignPath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist-signed

      - name: Use the signed files
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        run: |
          cp -f dist-signed/*.exe dist/
          # rebuild the portable zip around the signed launcher
          v="$(tr -d '[:space:]' < VERSION)"
          cp -f dist/ArabicPDFTools.exe "build/portable/Arabic PDF Tools (Portable)/ArabicPDFTools.exe"
          rm -f "dist/ArabicPDFTools-Portable-$v.zip"
          (cd build/portable && zip -q -r -9 "../../dist/ArabicPDFTools-Portable-$v.zip" "Arabic PDF Tools (Portable)")

      - uses: actions/upload-artifact@v4
        with:
          name: arabic-pdf-tools-release
          path: |
            dist/ArabicPDFTools-Setup-*.exe
            dist/ArabicPDFTools-Portable-*.zip
            dist/Arabic-PDF-Tools-Script-*.zip
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          for f in dist/ArabicPDFTools-Setup-*.exe dist/ArabicPDFTools-Portable-*.zip dist/Arabic-PDF-Tools-Script-*.zip; do
            gh release upload "$TAG" "$f" --clobber
          done
